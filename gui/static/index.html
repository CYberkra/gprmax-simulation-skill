<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gprMax 仿真向导</title>
<style>
  /* taste-skill §1 restrained palette: neutral + single accent */
  :root {
    --bg: #f8fafc; --panel: #ffffff; --border: #e2e8f0;
    --text: #1e293b; --muted: #64748b;
    --accent: #0ea5e9; --accent-soft: #e0f2fe;
    --good: #16a34a; --warn: #d97706; --bad: #dc2626;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  }
  .topbar {
    background: #0b1120; color: #f8fafc; padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .topbar .status { font-size: 12px; color: #94a3b8; }

  /* step rail: horizontal pills with active accent */
  .steprail {
    display: flex; gap: 6px; padding: 14px 24px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .steprail button {
    border: 1px solid var(--border); background: #fff; color: var(--muted);
    border-radius: 999px; padding: 6px 14px; font-size: 12px; cursor: pointer;
    font-weight: 500;
  }
  .steprail button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .steprail button:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px; max-width: 1400px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .panel h2 { font-size: 13px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .panel.wide { grid-column: 1 / -1; }
  .step { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .step h3 { margin: 0 0 8px; font-size: 13px; }
  .field { margin-bottom: 8px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; background: #fff; color: var(--text);
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  button {
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; font-size: 13px; font-weight: 500;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { filter: brightness(0.97); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .rec { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .rec .axis { font-weight: 600; font-size: 13px; }
  .rec .rationale { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: 6px; }
  .tag.rec { background: var(--good); color: #fff; }
  .tag.def { background: var(--accent); color: #fff; }
  .muted { color: var(--muted); font-size: 12px; }
  pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; font-size: 12px; overflow: auto; max-height: 320px; }
  img.preview { max-width: 100%; border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; }
  .need { border-left: 3px solid var(--accent); padding: 6px 10px; margin-bottom: 6px; background: var(--accent-soft); border-radius: 0 6px 6px 0; font-size: 13px; }
  .need .reason { color: var(--muted); font-size: 12px; }
  .matched { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 10px; }
  .unmatched { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 10px; font-size: 13px; }
  .probe-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
  .probe-item .k { color: var(--muted); }
  .finding { padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
  .finding.OK { background: #f0fdf4; border: 1px solid #bbf7d0; }
  .finding.WARN { background: #fffbeb; border: 1px solid #fde68a; }
  .finding.BLOCK { background: #fef2f2; border: 1px solid #fecaca; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #f1f5f9; }
  th { color: var(--muted); font-weight: 600; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="topbar">
  <h1>gprMax 仿真向导</h1>
  <span class="status" id="sessionLabel">未创建会话</span>
</div>

<div class="steprail" id="stepRail"></div>

<div class="layout">
  <div class="panel" id="panelA"></div>
  <div class="panel" id="panelB"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
